<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="theme-color" content="#D97706">
  <meta name="description" content="Rent, cheques and maintenance for UAE landlords.">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LedGix Rent">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LedGix Rent</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Branded loading screen shown until Flutter draws its first frame. */
    html, body { margin: 0; height: 100%; background: #FFFBF5; }
    @media (prefers-color-scheme: dark) { html, body { background: #1C1917; } }
    #app-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 28px;
      background: linear-gradient(135deg, #FCD34D 0%, #F59E0B 55%, #D97706 100%);
      transition: opacity .25s ease;
      font: 600 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1C1917;
    }
    #app-loading img { width: 96px; height: 96px; border-radius: 24px; background: #fff; padding: 10px;
      box-shadow: 0 10px 30px rgba(120, 53, 15, .25); }
    #app-loading .bar { width: 140px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.55); overflow: hidden; }
    #app-loading .bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 4px;
      background: #1C1917; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #app-loading .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="app-loading" role="progressbar" aria-label="Loading LedGix Rent">
    <img src="icons/Icon-192.png" alt="">
    <div>LedGix Rent</div>
    <div class="bar"></div>
  </div>
  <!-- web/flutter_bootstrap.js removes the loading screen once the app is running. -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
