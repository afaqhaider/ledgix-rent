<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · LedGix Rent</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <script>
    (function () {
      var t = null; try { t = localStorage.getItem('ledgix-theme'); } catch (e) {}
      document.documentElement.setAttribute('data-theme', t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    })();
  </script>
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 32px 16px; position: relative; isolation: isolate; }
    .nf::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--wash); }
    .nf img { width: 56px; height: 56px; margin: 0 auto 24px; }
    .nf h1 { font-size: 96px; line-height: 1; letter-spacing: -3px; }
    .nf p { color: var(--body); margin: 16px auto 28px; max-width: 420px; }
  </style>
</head>
<body>
  <main class="nf">
    <div>
      <img src="/assets/rent-mark.png" alt="LedGix Rent">
      <h1>404</h1>
      <p>We couldn't find that page. It may have moved, or the link may be mistyped.</p>
      <a class="btn btn-primary btn-lg" href="/">Back to LedGix Rent</a>
    </div>
  </main>
</body>
</html>
